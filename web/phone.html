<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="/icon.png">
<!--PWA-->
<link rel="icon" href="/icon.png">
<meta name="apple-mobile-web-app-title" content="lanxfer">
<title>lanxfer</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#16181d;--mute:#69707d;--line:#e2e5ea;--acc:#2456d6;--ok:#167a3e;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1a1d24;--fg:#e8eaee;--mute:#99a1ad;--line:#2b2f39;--acc:#7aa5ff;--ok:#56d38a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
h1{font-size:20px;margin:0}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:600}
.speed{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mute{color:var(--mute);font-size:14px}
#code{font:600 28px ui-monospace,Menlo,monospace;letter-spacing:.2em;text-align:center;width:100%;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
button,.btn{display:block;width:100%;font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 16px;background:var(--acc);color:var(--card);text-align:center;cursor:pointer;margin-top:12px}
button:disabled{opacity:.4}
.file{padding:10px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:0;padding-top:0}
.file .top{display:flex;gap:10px;justify-content:space-between;align-items:center}
.file .name{overflow-wrap:anywhere}
.file .meta{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.file a{color:var(--acc);font-weight:600;text-decoration:none;white-space:nowrap;padding:6px 0 6px 10px}
.bar{height:5px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.done .bar i{background:var(--ok)}
.done .meta{color:var(--ok)}
.failed .meta,.bad{color:var(--bad)}
header{align-items:center}
.logo{width:30px;height:30px;border-radius:8px}
.conn{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.conn.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.banner{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--fg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.tile{width:40px;height:40px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;font:700 10px system-ui;letter-spacing:.04em;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);text-transform:uppercase}
.item .info{flex:1;min-width:0}
.item .name{overflow-wrap:anywhere;font-size:15px}
.item .meta{font-size:13px;color:var(--mute)}
.new{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:middle}
a.save{flex:0 0 auto;font-weight:600;font-size:14px;text-decoration:none;color:var(--card);background:var(--acc);border-radius:99px;padding:8px 16px}
a.save.done{background:none;color:var(--ok);border:1px solid var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><img src="/icon.png" alt="" class="logo"><h1>lanxfer</h1><span class="conn" id="peer"></span><span class="speed" id="speed"></span></header>

  <section id="pair" hidden>
    <h2>Pairing code</h2>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" aria-label="Pairing code">
    <button id="pairgo">Pair</button>
    <p class="mute" id="pairmsg">Enter the 6-digit code shown on the computer.</p>
  </section>

  <section id="down" hidden>
    <h2 id="downtitle">From the computer</h2>
    <div id="banner" class="banner" hidden></div>
    <div id="shared"></div>
    <p class="mute" id="noshared">Nothing yet. On the computer, add files in lanxfer and press <b>Send to phone</b>.</p>
  </section>

  <section id="up" hidden>
    <h2>Send to the computer</h2>
    <label class="btn" style="margin-top:0">Choose photos or files<input type="file" id="pick" multiple hidden></label>
    <div id="uploads" style="margin-top:14px" hidden></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const PARALLEL = 3, RETRIES = 4;
let sentBytes = 0;

function human(n) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function show(paired) {
  $('pair').hidden = paired;
  $('up').hidden = $('down').hidden = !paired;
}

// refresh loads the list of files the computer is sharing; a 401 means we
// still need to pair (or the computer restarted lanxfer).
async function refresh() {
  let r;
  try { r = await fetch('/api/state'); } catch (e) { $('peer').textContent = 'computer unreachable'; $('peer').className = 'conn'; return; }
  if (r.status === 401) { show(false); return; }
  const s = await r.json();
  show(true);
  $('peer').textContent = s.name;
  $('peer').className = 'conn on';
  $('downtitle').textContent = 'From ' + s.name;
  $('noshared').hidden = s.files.length > 0;

  const fresh = s.files.filter(f => !saved.has(f.id)).length;
  $('banner').hidden = !fresh;
  $('banner').textContent = fresh === 1 ? '1 new file. Tap Save to download it.' : fresh + ' new files. Tap Save next to each one.';

  // Rebuild only when the list changes, so a tap is never lost mid-refresh.
  const sig = s.files.map(f => f.id).join() + '|' + [...saved].join();
  if (sig === lastSig) return;
  lastSig = sig;
  $('shared').replaceChildren(...s.files.map(f => {
    const row = el('div', 'item');
    const ext = (f.name.match(/\.([a-z0-9]{1,4})$/i) || [, 'file'])[1];
    const info = el('div', 'info');
    const name = el('div', 'name', f.name);
    if (!saved.has(f.id)) name.append(el('span', 'new'));
    info.append(name, el('div', 'meta', human(f.size)));
    const a = el('a', 'save' + (saved.has(f.id) ? ' done' : ''), saved.has(f.id) ? 'Saved ✓' : 'Save');
    a.href = '/dl/' + f.id;
    a.download = f.name;
    a.onclick = () => { saved.add(f.id); remember(); setTimeout(refresh, 300); };
    row.append(el('div', 'tile', ext), info, a);
    return row;
  }));
}

// Which files this phone has already saved, so new ones stand out.
let lastSig = '';
const saved = new Set((() => { try { return JSON.parse(localStorage.getItem('saved') || '[]'); } catch (e) { return []; } })());
function remember() { try { localStorage.setItem('saved', JSON.stringify([...saved].slice(-500))); } catch (e) {} }

$('pairgo').onclick = async () => {
  const r = await fetch('/api/pair', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: $('code').value }),
  });
  if (r.ok) { refresh(); return; }
  $('pairmsg').textContent = r.status === 429 ? 'Too many attempts. Wait a few seconds and try again.' : 'That code is not right.';
  $('pairmsg').className = 'bad';
};
$('code').onkeydown = e => { if (e.key === 'Enter') $('pairgo').click(); };

async function sha256hex(buf) {
  if (!(window.crypto && crypto.subtle)) return ''; // TLS still protects the chunk in transit
  const d = new Uint8Array(await crypto.subtle.digest('SHA-256', buf));
  return Array.from(d, b => b.toString(16).padStart(2, '0')).join('');
}

async function putChunk(id, idx, buf, hash) {
  for (let attempt = 1; ; attempt++) {
    try {
      const r = await fetch(`/api/up/chunk?id=${id}&idx=${idx}`, { method: 'PUT', body: buf, headers: hash ? { 'X-SHA256': hash } : {} });
      if (r.ok) return;
      if (r.status === 401 || r.status === 404) throw Object.assign(new Error('The computer stopped the transfer'), { fatal: true });
    } catch (e) {
      if (e.fatal || attempt >= RETRIES) throw e;
    }
    if (attempt >= RETRIES) throw new Error('Connection lost');
    await new Promise(res => setTimeout(res, 800 * attempt));
  }
}

// upload sends one file in chunks over a few parallel requests, skipping
// chunks the computer already has from an earlier attempt.
async function upload(file, ui) {
  const start = await fetch('/api/up/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: file.name, size: file.size, mtime: file.lastModified }),
  });
  if (!start.ok) throw new Error(start.status === 401 ? 'Not paired' : 'The computer refused the file');
  const { id, chunk, have } = await start.json();
  const bits = Uint8Array.from(atob(have || ''), c => c.charCodeAt(0));
  const count = Math.ceil(file.size / chunk);
  const todo = [];
  let done = 0;
  for (let i = 0; i < count; i++) {
    if (bits[i >> 3] & (1 << (i & 7))) done += Math.min(chunk, file.size - i * chunk);
    else todo.push(i);
  }
  ui(done, 'sending');

  const worker = async () => {
    for (let idx = todo.shift(); idx !== undefined; idx = todo.shift()) {
      const buf = await file.slice(idx * chunk, Math.min(file.size, (idx + 1) * chunk)).arrayBuffer();
      await putChunk(id, idx, buf, await sha256hex(buf));
      done += buf.byteLength;
      sentBytes += buf.byteLength;
      ui(done, 'sending');
    }
  };
  await Promise.all(Array.from({ length: Math.min(PARALLEL, todo.length) }, worker));

  const fin = await fetch('/api/up/finish?id=' + id, { method: 'POST' });
  if (!fin.ok) throw new Error('The computer could not save the file');
  ui(file.size, 'saved on the computer ✓');
}

let chain = Promise.resolve();
$('pick').onchange = e => {
  for (const file of e.target.files) {
    const row = el('div', 'file'), top = el('div', 'top');
    const meta = el('span', 'meta', human(file.size) + ' · waiting');
    const bar = el('div', 'bar'), fill = el('i');
    top.append(el('span', 'name', file.name), meta);
    bar.append(fill);
    row.append(top, bar);
    $('uploads').append(row);
    $('uploads').hidden = false;
    const ui = (done, status) => {
      const pct = file.size ? Math.floor(100 * done / file.size) : 100;
      fill.style.width = pct + '%';
      meta.textContent = human(file.size) + ' · ' + (status === 'sending' ? pct + '%' : status);
      row.className = 'file' + (status === 'sending' ? '' : ' done');
    };
    chain = chain.then(() => upload(file, ui)).catch(err => {
      row.className = 'file failed';
      meta.textContent = (err.message || 'failed') + ' · choose it again to resume';
    });
  }
  e.target.value = '';
};

let last = 0;
setInterval(() => {
  const rate = (sentBytes - last) * 2;
  last = sentBytes;
  $('speed').textContent = rate > 0 ? human(rate) + '/s' : '';
}, 500);

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
